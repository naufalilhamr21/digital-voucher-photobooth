<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="alineasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#alineasGrad)" />
  
  <!-- Subtle Aperture Lens Ring Background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="24" />
  
  <!-- Modern Geometric 'A' Monogram -->
  <g filter="url(#shadow)">
    <!-- Main A Stems -->
    <path d="M256 96 L128 392 L192 392 L228 304 L284 304 L320 392 L384 392 Z" fill="#FFFFFF" />
    <!-- Inner Triangular Cutout -->
    <polygon points="256 184 238 252 274 252" fill="#DC2626" />
    <!-- Camera Shutter Focal Dot -->
    <circle cx="256" cy="356" r="14" fill="#FFFFFF" />
  </g>
</svg>
